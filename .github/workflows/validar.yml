name: Validar skills

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Integridade do repositório e contraste da paleta
        run: python3 .github/scripts/validar-repo.py

      - name: Empacotar a identidade visual para upload
        run: bash identidade-visual-v4/scripts/empacotar.sh

      - name: Publicar o pacote como artefato
        uses: actions/upload-artifact@v4
        with:
          name: identidade-visual-v4
          path: dist/identidade-visual-v4.zip
          if-no-files-found: error
