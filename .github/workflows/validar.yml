name: Validar skills

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Integridade do repositório e contraste da paleta
        run: python3 .github/scripts/validar-repo.py

      - name: Empacotar as skills para upload
        run: bash empacotar.sh --todas

      - name: Publicar os pacotes como artefato
        uses: actions/upload-artifact@v4
        with:
          name: skills-para-upload
          path: dist/*.zip
          if-no-files-found: error
